<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat SQL</title>
<style>
  :root { color-scheme: light dark; --line: #d8d8d8; --bg: #fff; --muted: #666; --accent: #2f6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --line: #333; --bg: #14161a; --muted: #999; --accent: #6ea8ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg);
         height: 100vh; display: grid; grid-template-columns: 380px 1fr; }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; } }

  #chat { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 8px 12px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bot { align-self: flex-start; border: 1px solid var(--line); }
  .err { border-color: #d9534f; color: #d9534f; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input, button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
                  background: transparent; color: inherit; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button[disabled] { opacity: .5; cursor: default; }

  #panel { display: flex; flex-direction: column; min-width: 0; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  #meta { color: var(--muted); font-size: 13px; flex: 1; }
  #sql { margin: 0; padding: 12px 16px; font-family: ui-monospace, monospace; font-size: 13px;
         color: var(--muted); border-bottom: 1px solid var(--line); white-space: pre-wrap; }
  #grid { flex: 1; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--bg); }
  tbody tr:nth-child(even) { background: color-mix(in srgb, currentColor 5%, transparent); }
</style>
</head>
<body>
<section id="chat">
  <div id="log"></div>
  <form id="form">
    <input id="q" placeholder="Ex.: quais as 5 marcas com mais modelos?" autocomplete="off" required>
    <button id="send">Enviar</button>
  </form>
</section>

<section id="panel">
  <div id="bar">
    <span id="meta">Nenhuma consulta ainda.</span>
    <button id="csv" disabled>Baixar CSV</button>
  </div>
  <pre id="sql"></pre>
  <div id="grid"></div>
</section>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');
const meta = document.getElementById('meta');
const sqlBox = document.getElementById('sql');
const grid = document.getElementById('grid');
const csvBtn = document.getElementById('csv');

const history = [];
let last = null;

function say(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function render(data) {
  sqlBox.textContent = data.sql || '';
  grid.innerHTML = '';
  csvBtn.disabled = !data.rows.length;
  last = data;

  if (!data.rows.length) {
    meta.textContent = data.error ? 'Erro na consulta.' : 'Sem linhas.';
    return;
  }
  meta.textContent = `${data.rows.length} linha(s)` + (data.truncated ? ' (truncado)' : '');

  const table = document.createElement('table');
  const head = table.createTHead().insertRow();
  for (const c of data.columns) {
    const th = document.createElement('th');
    th.textContent = c;
    head.appendChild(th);
  }
  const body = table.createTBody();
  for (const row of data.rows) {
    const tr = body.insertRow();
    for (const v of row) tr.insertCell().textContent = v === null ? '—' : v;
  }
  grid.appendChild(table);
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  say(question, 'user');
  input.value = '';
  send.disabled = true;
  const pending = say('…', 'bot');
  history.push({ role: 'user', content: question });

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    pending.textContent = data.error ? `${data.note}\n\n${data.error}` : data.note;
    if (data.error) pending.classList.add('err');
    history.push({ role: 'assistant', content: JSON.stringify({ sql: data.sql, note: data.note }) });
    render(data);
  } catch (err) {
    pending.textContent = 'Falha: ' + err.message;
    pending.classList.add('err');
    history.pop();
  } finally {
    send.disabled = false;
    input.focus();
  }
};

csvBtn.onclick = () => {
  const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [last.columns.map(cell).join(','), ...last.rows.map(r => r.map(cell).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'consulta.csv' });
  a.click();
  URL.revokeObjectURL(url);
};

input.focus();
</script>
</body>
</html>
